name: 美股策略選股(VCP + 趨勢模板)

# 美股收盤後計算,算完把頁面存進 cache,再觸發網站發布流程(只發布、不重抓其他市場)。
on:
  schedule:
    # 週一~週五 23:20 UTC = 台灣隔日 07:20(美股收盤、Yahoo 日線更新後)
    - cron: "20 23 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "strategies-us/**"
      - "strategies/backtest.py"
      - ".github/workflows/strategies-us.yml"

permissions:
  contents: read
  actions: write          # 觸發網站發布流程

concurrency:
  group: strategies-us
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: strategies-us/requirements.txt

      - run: pip install -r strategies-us/requirements.txt

      # SEC 歷史財報抓過就不會變,快取起來
      - uses: actions/cache/restore@v4
        with:
          path: strategies-us/.cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-

      - name: 抓資料、回測、取最新選股
        timeout-minutes: 75
        working-directory: strategies-us
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}     # SEC 規定要附聯絡 email;沒設定就只跑價格類策略
        run: python fetch_us.py

      - name: 保存 SEC 財報快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: strategies-us/.cache
          key: sec-cache-${{ github.run_id }}

      - name: 保存策略頁面
        uses: actions/cache/save@v4
        with:
          path: strategies-us/策略選股_美股.html
          key: strat-us-out-${{ github.run_id }}

      - name: 觸發網站發布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run zsigma-us.yml --ref "${{ github.ref_name }}" -f markets=none
