name: Zsigma 掃描(美股 + 台股)

on:
  schedule:
    # 台股盤中:台灣 09:07~13:37 每 30 分鐘(只更新台股)
    - cron: "7,37 1-5 * * 1-5"
    # 台股收盤後:台灣 15:30(只更新台股)
    - cron: "30 7 * * 1-5"
    # 美股收盤後:台灣隔日 06:30(只更新美股)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:        # 可在 Actions 頁面手動執行
  push:
    paths:
      - "zsigma-us/**"
      - "zsigma-tw/**"
      - ".github/workflows/zsigma-us.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zsigma-pages
  cancel-in-progress: false

env:
  SITE: https://peterpita-tech.github.io/Peterpita

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zsigma-us/requirements.txt

      # 排程只更新對應市場;手動執行 / push 兩個都更新
      - name: 決定要更新哪個市場
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            "30 22 * * 1-5") echo "us=true"  >> "$GITHUB_OUTPUT"; echo "tw=false" >> "$GITHUB_OUTPUT" ;;
            "")              echo "us=true"  >> "$GITHUB_OUTPUT"; echo "tw=true"  >> "$GITHUB_OUTPUT" ;;
            *)               echo "us=false" >> "$GITHUB_OUTPUT"; echo "tw=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 安裝套件
        run: pip install -r zsigma-us/requirements.txt

      - name: 美股:抓資料並計算指標
        id: us
        if: steps.plan.outputs.us == 'true'
        continue-on-error: true
        working-directory: zsigma-us
        run: python fetch_zsigma_us.py

      - name: 台股:抓資料並計算指標
        id: tw
        if: steps.plan.outputs.tw == 'true'
        continue-on-error: true
        working-directory: zsigma-tw
        run: python fetch_zsigma_tw.py

      # 沒更新(或失敗)的市場沿用網站上目前的版本
      - name: 準備網站檔案
        env:
          US: ${{ steps.us.outcome }}
          TW: ${{ steps.tw.outcome }}
        run: |
          mkdir -p _site/tw
          touch _site/.nojekyll
          if [ "$US" = success ]; then
            cp "zsigma-us/Zsigma籌碼掃描_美股.html" _site/index.html
          else
            [ "$US" = failure ] && echo "::warning::美股更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/" -o _site/index.html || cp zsigma-us/index.html _site/index.html
          fi
          if [ "$TW" = success ]; then
            cp "zsigma-tw/Zsigma籌碼掃描_台股.html" _site/tw/index.html
          else
            [ "$TW" = failure ] && echo "::warning::台股更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/tw/" -o _site/tw/index.html || cp zsigma-tw/index.html _site/tw/index.html
          fi
          if [ "$US" != success ] && [ "$TW" != success ]; then
            echo "::error::這次沒有任何市場更新成功"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
