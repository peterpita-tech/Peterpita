name: Zsigma 美股掃描

on:
  schedule:
    # 週一~週五 22:30 UTC = 台灣時間 週二~週六 06:30(美股收盤後)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:        # 可在 Actions 頁面手動執行
  push:
    paths:
      - "zsigma-us/**"
      - ".github/workflows/zsigma-us.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zsigma-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zsigma-us/requirements.txt

      - name: 安裝套件
        run: pip install -r zsigma-us/requirements.txt

      - name: 抓全美股資料並計算指標
        working-directory: zsigma-us
        run: python fetch_zsigma_us.py

      - name: 準備網站檔案
        run: |
          mkdir -p _site
          cp "zsigma-us/Zsigma籌碼掃描_美股.html" _site/index.html
          cp zsigma-us/data.js _site/data.js
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
