name: Zsigma 掃描(美股 + 台股)

on:
  schedule:
    # 週一~週五 07:30 UTC = 台灣 15:30(台股收盤後)
    - cron: "30 7 * * 1-5"
    # 週一~週五 22:30 UTC = 台灣隔日 06:30(美股收盤後)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:        # 可在 Actions 頁面手動執行
  push:
    paths:
      - "zsigma-us/**"
      - "zsigma-tw/**"
      - ".github/workflows/zsigma-us.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zsigma-pages
  cancel-in-progress: false

env:
  SITE: https://peterpita-tech.github.io/Peterpita

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zsigma-us/requirements.txt

      - name: 安裝套件
        run: pip install -r zsigma-us/requirements.txt

      - name: 美股:抓資料並計算指標
        id: us
        continue-on-error: true
        working-directory: zsigma-us
        run: python fetch_zsigma_us.py

      - name: 台股:抓資料並計算指標
        id: tw
        continue-on-error: true
        working-directory: zsigma-tw
        run: python fetch_zsigma_tw.py

      # 某一邊失敗時沿用網站上目前的版本,另一邊照常更新
      - name: 準備網站檔案
        run: |
          mkdir -p _site/tw
          touch _site/.nojekyll
          if [ "${{ steps.us.outcome }}" = success ]; then
            cp "zsigma-us/Zsigma籌碼掃描_美股.html" _site/index.html
          else
            echo "::warning::美股更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/" -o _site/index.html
          fi
          if [ "${{ steps.tw.outcome }}" = success ]; then
            cp "zsigma-tw/Zsigma籌碼掃描_台股.html" _site/tw/index.html
          else
            echo "::warning::台股更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/tw/" -o _site/tw/index.html || cp zsigma-tw/index.html _site/tw/index.html
          fi
          if [ "${{ steps.us.outcome }}" != success ] && [ "${{ steps.tw.outcome }}" != success ]; then
            echo "::error::美股與台股都更新失敗"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
