name: 籌碼結構掃描(美股 + 台股)+ 台股重大訊息 + 策略選股

on:
  schedule:
    # 台股盤中:台灣 09:07~13:37 每 30 分鐘(只更新台股)
    - cron: "7,37 1-5 * * 1-5"
    # 台股收盤後:台灣 15:30(只更新台股)
    - cron: "30 7 * * 1-5"
    # 美股收盤後:台灣隔日 06:30(只更新美股)
    - cron: "30 22 * * 1-5"
    # 重大訊息:台灣每天 17:50 / 19:50 / 21:50 / 23:50(含假日;其他排程也會順便更新)
    - cron: "50 9,11,13,15 * * *"
    # 策略選股:台灣週一~週五 20:40(Yahoo 收盤價、觀測站月營收 / 財報都已更新)
    - cron: "40 12 * * 1-5"
  workflow_dispatch:        # 可在 Actions 頁面手動執行
  push:
    paths:
      - "zsigma-us/**"
      - "zsigma-tw/**"
      - "mops-news/**"
      - "strategies/**"
      - ".github/workflows/zsigma-us.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zsigma-pages
  cancel-in-progress: false

env:
  SITE: https://peterpita-tech.github.io/Peterpita

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            zsigma-us/requirements.txt
            strategies/requirements.txt

      # 排程只更新對應市場;手動執行 / push 兩個都更新
      - name: 決定要更新哪個市場
        id: plan
        run: |
          strat=false
          case "${{ github.event.schedule }}" in
            "30 22 * * 1-5") echo "us=true"  >> "$GITHUB_OUTPUT"; echo "tw=false" >> "$GITHUB_OUTPUT" ;;
            "50 9,11,13,15 * * *") echo "us=false" >> "$GITHUB_OUTPUT"; echo "tw=false" >> "$GITHUB_OUTPUT" ;;
            "40 12 * * 1-5") echo "us=false" >> "$GITHUB_OUTPUT"; echo "tw=false" >> "$GITHUB_OUTPUT"; strat=true ;;
            "")              echo "us=true"  >> "$GITHUB_OUTPUT"; echo "tw=true"  >> "$GITHUB_OUTPUT"; strat=true ;;
            *)               echo "us=false" >> "$GITHUB_OUTPUT"; echo "tw=true"  >> "$GITHUB_OUTPUT" ;;
          esac
          echo "strat=$strat" >> "$GITHUB_OUTPUT"

      - name: 安裝套件
        run: pip install -r zsigma-us/requirements.txt

      - name: 美股:抓資料並計算指標
        id: us
        if: steps.plan.outputs.us == 'true'
        continue-on-error: true
        working-directory: zsigma-us
        run: python fetch_zsigma_us.py

      # 台股代號清單一天只需抓一次(腳本會判斷快取是否超過 20 小時)
      - uses: actions/cache@v4
        if: steps.plan.outputs.tw == 'true'
        with:
          path: zsigma-tw/.universe_cache.json
          key: tw-universe-${{ github.run_id }}
          restore-keys: tw-universe-

      - name: 台股:抓資料並計算指標
        id: tw
        if: steps.plan.outputs.tw == 'true'
        continue-on-error: true
        working-directory: zsigma-tw
        run: python fetch_zsigma_tw.py

      # 重大訊息每次都更新;OpenAPI 只給當天資料,和網站上的上一版合併累積歷史
      - name: 台股重大訊息:公開資訊觀測站
        id: news
        continue-on-error: true
        working-directory: mops-news
        run: python fetch_mops_news.py --prev "$SITE/news/data.json"

      # 觀測站歷史月營收 / 財報抓過就不會變,快取起來(第一次約 20 分鐘,之後幾分鐘)
      - uses: actions/cache@v4
        if: steps.plan.outputs.strat == 'true'
        with:
          path: strategies/.cache
          key: strat-cache-${{ github.run_id }}
          restore-keys: strat-cache-

      - name: 策略選股:免費資料回測與最新選股
        id: strat
        if: steps.plan.outputs.strat == 'true'
        continue-on-error: true
        timeout-minutes: 45
        working-directory: strategies
        run: |
          pip install -r requirements.txt
          python fetch_strategies.py

      # 沒更新(或失敗)的市場沿用網站上目前的版本
      - name: 準備網站檔案
        env:
          US: ${{ steps.us.outcome }}
          TW: ${{ steps.tw.outcome }}
          NEWS: ${{ steps.news.outcome }}
          STRAT: ${{ steps.strat.outcome }}
        run: |
          mkdir -p _site/tw _site/news _site/strategies
          touch _site/.nojekyll
          if [ "$US" = success ]; then
            cp "zsigma-us/籌碼結構掃描_美股.html" _site/index.html
          else
            [ "$US" = failure ] && echo "::warning::美股更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/" -o _site/index.html || cp zsigma-us/index.html _site/index.html
          fi
          if [ "$TW" = success ]; then
            cp "zsigma-tw/籌碼結構掃描_台股.html" _site/tw/index.html
          else
            [ "$TW" = failure ] && echo "::warning::台股更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/tw/" -o _site/tw/index.html || cp zsigma-tw/index.html _site/tw/index.html
          fi
          cp mops-news/index.html _site/news/index.html
          if [ "$NEWS" = success ]; then
            cp mops-news/data.json _site/news/data.json
          else
            echo "::warning::重大訊息更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/news/data.json" -o _site/news/data.json || true
          fi
          if [ "$STRAT" = success ]; then
            cp "strategies/策略選股.html" _site/strategies/index.html
          else
            [ "$STRAT" = failure ] && echo "::warning::策略選股更新失敗,沿用網站上的舊版"
            curl -fsSL "$SITE/strategies/" -o _site/strategies/index.html || cp strategies/index.html _site/strategies/index.html
          fi
          if [ "$US" != success ] && [ "$TW" != success ] && [ "$NEWS" != success ] && [ "$STRAT" != success ]; then
            echo "::error::這次沒有任何市場更新成功"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
