# 暫時用:測試上櫃重大訊息資料來源,確認後刪除
name: mops-probe
on:
  push:
    paths: [".github/workflows/mops-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          p() { echo; echo "===== $*"; curl -sS -m 40 -A "$UA" -D - -o body "$@" | head -15; echo "--- size $(wc -c < body)"; head -c 700 body; echo; }
          p https://www.tpex.org.tw/openapi/v1/mopsfe_t187ap04_O
          p -H "Accept: application/json" https://www.tpex.org.tw/openapi/v1/mopsfe_t187ap04_O
          p https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes
          p https://www.tpex.org.tw/openapi/swagger.json
          grep -o '"/[^"]*t187ap04[^"]*"' body || true
          grep -o '"/mopsfe[^"]*"' body | head -40 || true
          p -X POST -H "Content-Type: application/json" -d '{}' https://mops.twse.com.tw/mops/api/t05sr01_1
          p https://mops.twse.com.tw/mops/api/t05sr01_1
          p -X POST -d 'encodeURIComponent=1&step=0&firstin=1&off=1&TYPEK=all' https://mopsov.twse.com.tw/mops/web/ajax_t05sr01_1
          p https://mopsov.twse.com.tw/mops/web/t05sr01_1
          p https://openapi.twse.com.tw/v1/opendata/t187ap04_L
