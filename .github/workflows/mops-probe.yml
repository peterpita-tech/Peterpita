# 暫時用:測試觀測站即時重大訊息來源,確認後刪除
name: mops-probe
on:
  push:
    paths: [".github/workflows/mops-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          p() { echo; echo "===== $*"; curl -sS -m 40 -A "$UA" -o body -w "HTTP %{http_code} %{content_type}\n" "$@"; echo "--- size $(wc -c < body)"; head -c 2500 body; echo; }
          U=https://mopsov.twse.com.tw/mops/web/ajax_t05sr01_1
          for T in sii otc; do curl -sS -m 40 -A "$UA" -d "encodeURIComponent=1&step=0&firstin=1&off=1&TYPEK=$T" $U -o l_$T; echo "== $T rows: $(grep -c "<tr class='\(odd\|even\)'" l_$T)"; done
          grep -o "onclick=\"document.fm_t05sr01_1.SEQ_NO[^\"]*\"" l_otc | head -3
          p -d 'TYPEK=all&step=1&firstin=true&COMPANY_ID=6227&SPOKE_DATE=20261008&SPOKE_TIME=155428&SEQ_NO=1&skey=6227202610081&hhc_co_name=&COMPANY_NAME=' $U
          tr -s ' \t\r\n' ' ' < body | sed 's/<[^>]*>/|/g; s/|[| ]*|/|/g' | head -c 3000; echo
          sleep 2
          p -d 'TYPEK=all&step=1&firstin=true&COMPANY_ID=7740&SPOKE_DATE=20261008&SPOKE_TIME=151849&SEQ_NO=4&skey=7740202610054' $U
          tr -s ' \t\r\n' ' ' < body | sed 's/<[^>]*>/|/g; s/|[| ]*|/|/g' | head -c 1500; echo
