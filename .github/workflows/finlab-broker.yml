name: FinLab 券商分點回測

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "畫走勢圖的股票代號"
        default: "2330"
      top:
        description: "回測每期持股檔數"
        default: "20"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 本機執行 `python -m finlab token --env` 取得,存到 repo 的 Settings → Secrets → Actions
      FINLAB_REFRESH_TOKEN: ${{ secrets.FINLAB_REFRESH_TOKEN }}
      FINLAB_SESSION_ID: ${{ secrets.FINLAB_SESSION_ID }}
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
    steps:
      - name: 檢查 FinLab 憑證
        run: |
          for k in FINLAB_REFRESH_TOKEN FINLAB_SESSION_ID FINLAB_API_KEY; do
            if [ -z "${!k}" ]; then echo "::error::缺少 secret $k,請見 finlab-broker/README.md"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finlab-broker/requirements.txt

      - name: 安裝中文字型與套件
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r finlab-broker/requirements.txt

      - name: 抓分點資料、畫圖、回測
        working-directory: finlab-broker
        run: python broker_demo.py --stock "${{ inputs.stock }}" --top "${{ inputs.top }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finlab-broker-output
          path: finlab-broker/output/
          if-no-files-found: ignore
